name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Commit APK directly to main branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./HillClimb-v1.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./HillClimb-v1.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add HillClimb-v1.4.apk HillClimb-v1.2.apk app-debug.apk
          git commit -m "Update offline APK binaries with fixed scripts [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push failed or already up to date"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hill-Hop-Horizon-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4
          name: "Hill Hop Horizon APK v1.4 (مسابقه هوش مصنوعی، سکه نامحدود، ۱۰ ماشین اختصاصی)"
          body: |
            نسخه v1.2 بازی تپه‌نورد (Hill Hop Horizon) - کاملاً آفلاین و رفع مشکل لود نشدن اسکریپت‌ها.
            
            ویژگی‌ها:
            - اضافه شدن ۱۰ ماشین جدید با ارتقای اختصاصی
            - منوی منظم و تفکیک‌شده
            - اصلاح کامل اسکریپت‌های آفلاین در WebView
            - فیزیک طبیعی‌تر و پرش‌های متعادل
            - موسیقی و کنترل صدا
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update legacy v1.2 release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
